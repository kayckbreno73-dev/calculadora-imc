<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Calculadora IMC</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background-color: #e8e3df;
        font-family: Arial, sans-serif;
        color: #222;
      }

      .container {
        width: 100%;
        max-width: 450px;
        margin: auto;
        padding: 20px;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }

      h1 {
        text-align: center;
        font-size: 24px;
        font-weight: normal;
        margin-bottom: 10px;
      }

      h2 {
        text-align: center;
        font-size: 20px;
        font-weight: normal;
        margin-bottom: 35px;
      }

      label {
        display: block;
        font-size: 14px;
        margin-bottom: 7px;
      }

      input {
        width: 100%;
        height: 35px;
        border: none;
        border-radius: 4px;
        background-color: white;
        padding: 8px;
        margin-bottom: 20px;
        font-size: 16px;
      }

      button {
        display: block;
        margin: 10px auto;
        padding: 10px 15px;
        border: none;
        border-radius: 4px;
        background-color: #198754;
        color: white;
        cursor: pointer;
        font-size: 14px;
      }

      button:hover {
        background-color: #146c43;
      }

      #resultado {
        margin-top: 20px;
        font-size: 16px;
        line-height: 1.5;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h1>IMC</h1>

      <h2>Índice de Massa Corporal</h2>

      <label for="peso">Massa em Kg:</label>
      <input type="number" id="peso" step="any" placeholder="" />

      <label for="altura">Altura em m:</label>
      <input type="number" id="altura" step="any" placeholder="" />

      <button onclick="calcularIMC()">Calcular IMC</button>

      <p id="resultado"></p>
    </div>

    <script>
      function calcularIMC() {
        const peso = parseFloat(
          document.getElementById("peso").value.replace(",", "."),
        );

        const altura = parseFloat(
          document.getElementById("altura").value.replace(",", "."),
        );

        const resultado = document.getElementById("resultado");

        if (!peso || !altura || peso <= 0 || altura <= 0) {
          resultado.innerHTML = "Preencha os campos corretamente.";
          return;
        }

        const imc = peso / (altura * altura);

        let classificacao;

        if (imc < 18.5) {
          classificacao = "abaixo do peso";
        } else if (imc < 25) {
          classificacao = "em uma faixa considerada normal para adultos";
        } else if (imc < 30) {
          classificacao = "acima da faixa considerada normal para adultos";
        } else {
          classificacao = "em uma faixa elevada para adultos";
        }

        resultado.innerHTML =
          "Seu IMC é " + imc.toFixed(2) + ". Você está " + classificacao + ".";
      }
    </script>
  </body>
</html>
